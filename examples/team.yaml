version: 1
active: padrao
settings:
  permission_mode: governed # governed | auto_edit | full_access
  worktrees: true
  jira_enabled: true
  auto_commit: true
  auto_pr: true
  homolog_branch: homolog
  protected_branches:
    - main
    - master
    - production
  require_main_merge_approval: true
  max_qa_loops: 3
  max_dev_calls: 80            # aborta dev em loop de chamadas sem entregar
  max_dev_explore_calls: 40    # aborta dev que só lê/busca sem editar nada
  max_dev_input_tokens: 1500000 # orçamento de tokens de entrada por dev por rodada
  base_branch: main
  confirm_shell: true
  # Fonte única: internal/team (DefaultAllowlist). O teste
  # TestExamplesTeamYAMLAllowlistInSync garante que esta lista nunca
  # divergir do código — edite DefaultAllowlist e copie aqui.
  shell_allowlist:
    - git
    - gh
    - go
    - gofmt
    - python
    - python3
    - pytest
    - pip
    - node
    - npm
    - npx
    - pnpm
    - yarn
    - bun
    - cargo
    - rustc
    - mvn
    - gradle
    - dotnet
    - make
    - cmake
    - echo
    - printf
    - ls
    - dir
    - cat
    - type
    - pwd
    - rg
    - find
teams:
  - name: padrao
    description: Time de exemplo com um desenvolvedor
    agents:
      - name: pm
        role: project_manager
        provider: agy
        model: agy
      - name: tech_lead
        role: tech_lead
        provider: agy
        model: agy:gemini-3.8-flash-medium:medium
      - name: architect
        role: architect
        provider: agy
        model: agy
      - name: dev_1
        role: developer
        provider: agy
        model: agy
      - name: qa
        role: qa
        provider: agy
        model: agy
  - name: revisao
    description: Time em que o QA usa outro modelo
    agents:
      - name: pm
        role: project_manager
        provider: gemini
        model: gemini-flash-latest
      - name: tech_lead
        role: tech_lead
        provider: gemini
        model: gemini-flash-latest
      - name: architect
        role: architect
        provider: gemini
        model: gemini-flash-latest
      - name: dev_1
        role: developer
        provider: openai
        model: gpt-4.1
      - name: qa
        role: qa
        provider: anthropic
        model: claude-sonnet-4-5
