name: HiveMind CI

on:
  push:
    branches:
      - main
      - hivemind-cli-go
  pull_request:
    branches:
      - main
      - hivemind-cli-go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cli-ubuntu:
    name: Testes CLI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Instalar bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Análise estática (go vet)
        run: go vet ./...
      # ./... cobre todos os pacotes do módulo raiz — inclusive remote/relayclient
      # quando a Onda 3 movê-los para internal/ (Spec 10 §3.2.3).
      - name: Testes unitários do CLI (com race detector)
        run: go test -race -count=1 ./...

  test-cli-windows:
    name: Testes CLI (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Análise estática (go vet)
        run: go vet ./...
      # Race detector também no Windows: os lockfiles cross-process são a plataforma
      # alvo (mutex de kernel, CredMan), é aqui que data race escondido aparece.
      - name: Testes unitários do CLI no Windows (com race detector)
        run: go test -race -count=1 ./...

  test-ide:
    name: Testes IDE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências do frontend (Linux WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build do frontend da IDE
        working-directory: ide/frontend
        run: |
          npm ci
          npm run build
      - name: Testes do bridge remoto e do cliente relay (com race detector)
        working-directory: ide
        run: |
          go vet ./internal/remote/... ./internal/relayclient/...
          go test -race -count=1 ./internal/remote/... ./internal/relayclient/...
      - name: Análise estática e testes unitários do core da IDE
        working-directory: ide
        run: |
          go vet ./internal/idecore/...
          go test -race -count=1 ./internal/idecore/...
      - name: Build e smoke-check do executável da IDE (Windows)
        if: runner.os == 'Windows'
        working-directory: ide
        shell: pwsh
        run: |
          $version = (Get-Content ..\VERSION -Raw).Trim()
          $ldflags = "-s -w -H windowsgui -X github.com/gilvan-Borges/HiveMind/internal/version.Version=$version -X github.com/gilvan-Borges/HiveMind/internal/version.Commit=$env:GITHUB_SHA -X github.com/gilvan-Borges/HiveMind/internal/version.BuildDate=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          go vet -tags desktop,production ./...
          # Destino único ide/build/bin/ (Spec 10 §3.2.1): nenhuma cópia extra em ide/build/.
          New-Item -ItemType Directory -Force build\bin | Out-Null
          go build -tags desktop,production -ldflags $ldflags -o build\bin\hivemind-ide.exe .
          .\build\bin\hivemind-ide.exe --version
          .\build\bin\hivemind-ide.exe --smoke-check
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: hivemind-ide-windows-amd64
          path: ide/build/bin/hivemind-ide.exe

  test-android:
    name: Testes HiveMind-App (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # O app mobile é um repositório Git independente (gilvan-Borges/HiveMind-App).
      - uses: actions/checkout@v4
        with:
          repository: gilvan-Borges/HiveMind-App
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários e lint do app Android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

  govulncheck:
    name: Vulnerabilidades (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: govulncheck ./... (módulo raiz)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: govulncheck ./... (módulo ide)
        working-directory: ide
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-cli:
    name: Binário CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: hivemind
          - goos: windows
            goarch: amd64
            bin: hivemind.exe
          - goos: darwin
            goarch: amd64
            bin: hivemind
          - goos: darwin
            goarch: arm64
            bin: hivemind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Compilar binário estático com versão injetada
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          pkg="github.com/gilvan-Borges/HiveMind/internal/version"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${GITHUB_SHA::8} -X ${pkg}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "dist/${{ matrix.bin }}" ./cmd/hivemind
          sha256sum "dist/${{ matrix.bin }}" > "dist/${{ matrix.bin }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hivemind-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ matrix.bin }}
            dist/${{ matrix.bin }}.sha256

  build-relay:
    name: Binário relay linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Compilar hivemind-relay estático com versão injetada
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          pkg="github.com/gilvan-Borges/HiveMind/internal/version"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${GITHUB_SHA::8} -X ${pkg}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/hivemind-relay ./cmd/hivemind-relay
          sha256sum dist/hivemind-relay > dist/hivemind-relay.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hivemind-relay-linux-${{ matrix.goarch }}
          path: |
            dist/hivemind-relay
            dist/hivemind-relay.sha256
