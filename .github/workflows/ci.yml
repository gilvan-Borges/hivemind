name: HiveMind CI

on:
  push:
    branches:
      - main
      - hivemind-cli-go
  pull_request:
    branches:
      - main
      - hivemind-cli-go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cli-ubuntu:
    name: Testes CLI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Análise estática (go vet)
        run: go vet ./...
      - name: Testes unitários do CLI (com race detector)
        run: go test -race -count=1 ./...

  test-cli-windows:
    name: Testes CLI (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Análise estática (go vet)
        run: go vet ./...
      - name: Testes unitários do CLI no Windows
        run: go test -count=1 ./...

  test-ide:
    name: Testes IDE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências do frontend (Linux WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build do frontend da IDE
        working-directory: ide/frontend
        run: |
          npm ci
          npm run build
      - name: Análise estática e testes unitários do core da IDE
        working-directory: ide
        run: |
          go vet ./internal/idecore/...
          go test -v ./internal/idecore/...
      - name: Build e smoke-check do executável da IDE (Windows)
        if: runner.os == 'Windows'
        working-directory: ide
        run: |
          go vet -tags desktop,production ./...
          go build -tags desktop,production -ldflags "-s -w -H windowsgui" -o build\hivemind-ide.exe .
          .\build\hivemind-ide.exe --smoke-check
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: hivemind-ide-windows-amd64
          path: ide/build/hivemind-ide.exe

  build-cli:
    name: Binário CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: hivemind
          - goos: windows
            goarch: amd64
            bin: hivemind.exe
          - goos: darwin
            goarch: amd64
            bin: hivemind
          - goos: darwin
            goarch: arm64
            bin: hivemind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Compilar binário estático
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.bin }}" ./cmd/hivemind
      - uses: actions/upload-artifact@v4
        with:
          name: hivemind-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.bin }}
