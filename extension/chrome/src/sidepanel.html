<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hive</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <path fill="#C6A15B" d="M16 2 28 9v14L16 30 4 23V9L16 2zm0 4.2L8 11v10l8 4.8 8-4.8V11L16 6.2z" />
          <circle cx="16" cy="16" r="3" fill="#E8C881" />
        </svg>
      </div>
      <div>
        <strong>Agent Hive</strong>
        <p>Chrome real, com a sua sessão</p>
      </div>
      <span id="status">desconectado</span>
    </header>
    <main id="log" aria-live="polite">
      <div class="msg agent">A ponte fica em 127.0.0.1. O host nativo não mostra o código. Se carregou a extensão descompactada, cole o código de <code>hivemind browser pair</code>.</div>
    </main>
    <button id="stop" type="button" hidden>Parar o agente</button>
    <form id="composer">
      <textarea id="text" rows="2" placeholder="Diga ao Agent Hive o que fazer no Chrome"></textarea>
      <button type="submit">Enviar</button>
    </form>
    <details>
      <summary>Parear com código</summary>
      <form id="pair">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="código local" />
        <button type="submit">Conectar</button>
      </form>
    </details>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
