<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hive</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <path fill="#C6A15B" d="M16 2 28 9v14L16 30 4 23V9L16 2zm0 4.2L8 11v10l8 4.8 8-4.8V11L16 6.2z" />
          <circle cx="16" cy="16" r="3" fill="#E8C881" />
        </svg>
      </div>
      <div class="titles">
        <strong>Agent Hive</strong>
        <p id="tabctx">Nenhuma aba</p>
      </div>
      <span id="status" role="status">desconectado</span>
    </header>
    <div class="meter-row">
      <p id="meter" class="meter" aria-live="polite">sessão ≈ 0 tok</p>
      <button id="clear" type="button" class="clear-btn" hidden title="Limpar conversa">Limpar</button>
    </div>
    <main id="log" role="log" aria-live="polite" aria-relevant="additions"></main>
    <div class="dock">
      <form id="composer" class="composer-box">
        <label class="sr" for="text">Mensagem para o Agent Hive</label>
        <textarea id="text" rows="2" placeholder="Peça ao Agent Hive para ler, clicar ou resumir esta aba…"></textarea>
        <div class="composer-bar">
          <div class="composer-tools">
            <button id="pick" type="button" class="tool-chip" title="Apontar um elemento na página">Apontar</button>
            <button id="stop" type="button" class="tool-chip stop-chip" title="Parar execução (Esc)">Parar</button>
          </div>
          <button type="submit" id="send" class="send-btn" aria-label="Enviar">↑</button>
        </div>
      </form>
      <div class="dock-foot">
        <span class="hint">Enter envia · Shift+Enter quebra · Esc para</span>
        <details class="pair">
          <summary>Parear</summary>
          <form id="pair">
            <label class="sr" for="token">Código de pareamento</label>
            <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="código local (64 hex)" />
            <button type="submit">Conectar</button>
          </form>
        </details>
      </div>
    </div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
