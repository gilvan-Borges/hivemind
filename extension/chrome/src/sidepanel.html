<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hive</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <path fill="#C6A15B" d="M16 2 28 9v14L16 30 4 23V9L16 2zm0 4.2L8 11v10l8 4.8 8-4.8V11L16 6.2z" />
          <circle cx="16" cy="16" r="3" fill="#E8C881" />
        </svg>
      </div>
      <div class="titles">
        <strong>Agent Hive</strong>
        <p>Chrome real</p>
      </div>
      <span id="status">desconectado</span>
    </header>
    <main id="log" aria-live="polite"></main>
    <div class="dock">
      <button id="stop" type="button">Parar</button>
      <form id="composer">
        <textarea id="text" rows="2" placeholder="Pedir ao Agent Hive"></textarea>
        <button type="submit" aria-label="Enviar">↑</button>
      </form>
      <details class="pair">
        <summary>Parear</summary>
        <form id="pair">
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="código local" />
          <button type="submit">Conectar</button>
        </form>
      </details>
    </div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
